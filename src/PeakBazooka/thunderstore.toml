[config]
schemaVersion = "0.1.0"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "FakeGameDevelopers"
name = "Bazooka"
description = "A rocket launcher for PEAK. Blast zombies, spiders and your friends off the mountain, or switch to RocketJump mode and fly up cliffs TF2-style."
websiteUrl = "https://github.com/fake-game-developers/peak-bazooka"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.2403"
PEAKModding-PEAKLib_Core = "1.7.2"
PEAKModding-PEAKLib_Items = "1.6.2"

[build]
icon = "../../icon.png"
readme = "../../THUNDERSTORE.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/Peak.Bazooka/release/PeakBazooka.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

[publish]
communities = [ "peak", ]

[publish.categories]
peak = [ "mods", "items", "all" ]
